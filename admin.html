<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin — MunimJi by Cool Art®</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-[#071b36] text-white px-4 py-4 shadow">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="MunimJi" class="h-8 bg-white p-1 rounded-lg" />
        <span class="font-extrabold text-sm sm:text-base">MunimJi Super Admin Control</span>
      </div>
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="text-xs bg-white/10 px-3 py-1.5 rounded-lg hover:bg-white/20">डैशबोर्ड देखें</a>
        <button type="button" id="adminLogoutBtn" class="text-xs bg-red-600 px-3 py-1.5 rounded-lg font-bold">लॉग आउट</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
      <div class="flex flex-wrap justify-between items-center gap-2 mb-6">
        <div>
          <h1 class="text-xl font-extrabold text-[#071b36]">पंजीकृत यूज़र्स और प्लान प्रबंधन</h1>
          <p class="text-xs text-slate-500">यहाँ से किसी भी यूज़र का प्लान Active, Trial या Blocked करें</p>
        </div>
        <span id="totalUsersBadge" class="text-xs font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-full">
          कुल यूज़र्स: 0
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-100 text-[#071b36] text-xs uppercase">
              <th class="p-3 rounded-l-xl">नाम / व्यापार</th>
              <th class="p-3">ईमेल</th>
              <th class="p-3">श्रेणी</th>
              <th class="p-3">प्लान स्थिति</th>
              <th class="p-3 rounded-r-xl text-right">कार्रवाई</th>
            </tr>
          </thead>
          <tbody id="adminUsersBody" class="text-sm divide-y divide-slate-100">
            <tr><td colspan="5" class="p-6 text-center text-slate-400">डेटा लोड हो रहा है...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t py-4 text-center text-xs text-slate-500">
    Cool Art® Advertising · MunimJi Admin System
  </footer>

  <script type="module">
    import {
      auth,
      db,
      signOut,
      onAuthStateChanged,
      SUPER_ADMIN_EMAIL,
      collection,
      doc,
      updateDoc,
      onSnapshot
    } from "./firebase-config.js";

    document.getElementById("adminLogoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    function loadAllUsers() {
      onSnapshot(collection(db, "users"), (snap) => {
        const tbody = document.getElementById("adminUsersBody");
        document.getElementById("totalUsersBadge").textContent = `कुल यूज़र्स: ${snap.size}`;
        const rows = [];
        snap.forEach((d) => {
          const u = d.data();
          rows.push(`
            <tr>
              <td class="p-3 font-bold">${u.displayName || "-"}</td>
              <td class="p-3 text-slate-600">${u.email || "-"}</td>
              <td class="p-3 text-xs uppercase font-bold text-slate-500">${u.businessType || "general"}</td>
              <td class="p-3">
                <span class="px-2.5 py-1 rounded-full text-xs font-extrabold ${
                  u.planStatus === "active"
                    ? "bg-emerald-100 text-emerald-800"
                    : u.planStatus === "blocked"
                    ? "bg-red-100 text-red-800"
                    : "bg-amber-100 text-amber-800"
                }">${u.planStatus || "trial"}</span>
              </td>
              <td class="p-3 text-right space-x-1">
                <button data-uid="${d.id}" data-status="active" class="status-btn bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">Active</button>
                <button data-uid="${d.id}" data-status="trial" class="status-btn bg-amber-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg">Demo</button>
                <button data-uid="${d.id}" data-status="blocked" class="status-btn bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">Block</button>
              </td>
            </tr>
          `);
        });
        tbody.innerHTML = rows.length ? rows.join("") : '<tr><td colspan="5" class="p-6 text-center text-slate-400">कोई यूज़र नहीं मिला।</td></tr>';

        document.querySelectorAll(".status-btn").forEach((b) => {
          b.addEventListener("click", async () => {
            const targetUid = b.getAttribute("data-uid");
            const nextStatus = b.getAttribute("data-status");
            const nextPlanName = nextStatus === "active" ? "Annual / Custom Plan" : nextStatus === "blocked" ? "Blocked" : "7-Day Free Demo";
            await updateDoc(doc(db, "users", targetUid), {
              planStatus: nextStatus,
              planName: nextPlanName
            });
          });
        });
      });
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      if ((user.email || "").toLowerCase() !== SUPER_ADMIN_EMAIL.toLowerCase()) {
        window.location.href = "dashboard.html";
        return;
      }
      loadAllUsers();
    });
  </script>
</body>
</html>
